name: Fuzz

on:
  # Daily, right after the llvm-project bump. workflow_run checks out the
  # latest default-branch commit, so the new submodule pin is picked up.
  workflow_run:
    workflows: [Update LLVM]
    types: [completed]
  workflow_dispatch:
    inputs:
      mutate:
        description: Mutants per test configuration
        default: '5'
      mutate_seed:
        description: First mutation seed
        default: '1'
      label:
        description: Group name on the results index
        default: main
      explore:
        description: Also run the deadline-driven "explore" pass
        type: boolean
        default: true
      exec_rate:
        description: Fraction of explore mutants the qemu execution oracle runs on
        default: '0.1'

permissions: {}

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  # GitHub-hosted jobs are killed at 6h; stay well below that.
  JOB_MINUTES: 330
  # Reserved per pass for fuzz_site.py (snippets, llvm-reduce, Compiler
  # Explorer); also the timeout of each "Build site" step.
  SITE_MINUTES: 45

jobs:
  fuzz:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      CC: clang
      CXX: clang++
      LLVM_USE_LINKER: lld
      MUTATE: ${{ inputs.mutate || '5' }}
      MUTATE_SEED: ${{ inputs.mutate_seed || '1' }}
      LABEL: ${{ inputs.label || 'main' }}
      EXEC_RATE: ${{ inputs.exec_rate || '0.1' }}
      # Each oracle configuration builds and runs three binaries; cap the qemu
      # time so a mutant with a slow loop cannot eat the budget.
      EXEC_BUDGET: '15'
      # Scheduled runs have no inputs (and null == false in expressions).
      EXPLORE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.explore) && 'false' || 'true' }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install build tools
        # lld also provides ld.lld, which links the execution oracle's binaries;
        # qemu-user-static runs them.
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build lld qemu-user-static

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build llc, llvm-extract, llvm-reduce, ir-mutate
        timeout-minutes: 240
        run: ./build.sh

      - name: sccache stats
        run: sccache --show-stats || true

      # Everything published so far: the findings of every earlier run (which
      # is what makes a category "NEW"), the Compiler Explorer cache, the
      # explore corpus and the energy weights.
      - name: Restore previous results
        run: |
          mkdir -p site
          if git fetch --depth 1 origin gh-pages; then
            # One archive per path: git archive fails on a path that does not
            # exist yet, and the others must still be restored.
            for p in data godbolt-cache.json corpus energy.json; do
              git archive FETCH_HEAD "$p" | tar -x -C site || true
            done
          fi
          python3 fuzz_site.py --site site --dump-keys history.json
          ls site site/data site/corpus || true

      # Fixed seeds: the same mutants every day, so changes between runs
      # come from LLVM, not from the mutator. The execution oracle runs on the
      # input tests only, which keeps this pass deterministic and bounded.
      - name: Campaign (main, fixed seeds)
        run: |
          set -euo pipefail
          elapsed=$(( ($(date +%s) - JOB_START) / 60 ))
          if [ "$EXPLORE" = true ]; then
            budget=$(( (JOB_MINUTES - 2 * SITE_MINUTES - elapsed) / 2 ))
          else
            budget=$(( JOB_MINUTES - SITE_MINUTES - elapsed ))
          fi
          if [ "$budget" -lt 10 ]; then budget=10; fi
          echo "elapsed ${elapsed} min, mutation time budget ${budget} min"
          timeout $(( (budget + 15) * 60 )) \
            python3 isel_diff.py --mutate "$MUTATE" --mutate-seed "$MUTATE_SEED" \
              --time-budget "$budget" --history history.json \
              --exec --exec-originals-only --exec-budget "$EXEC_BUDGET"

      - name: Build site (main)
        timeout-minutes: 45
        run: python3 fuzz_site.py --reduce --label "$LABEL" --site site

      # Takes whatever main left over: mutant rounds with new seeds, varying
      # mutation counts and mutated llc flags until the deadline. Results are
      # only kept when they add a category, novelty or a top regression.
      - name: Campaign (explore)
        id: explore
        if: env.EXPLORE == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          elapsed=$(( ($(date +%s) - JOB_START) / 60 ))
          budget=$(( JOB_MINUTES - SITE_MINUTES - elapsed ))
          if [ "$budget" -lt 5 ]; then echo "no time left"; exit 1; fi
          echo "elapsed ${elapsed} min, explore time budget ${budget} min"
          # Re-dumped so that what main already reported today does not count
          # as novelty here.
          python3 fuzz_site.py --site site --dump-keys history.json
          timeout $(( (budget + 10) * 60 )) \
            python3 isel_diff.py --explore --time-budget "$budget" --out out-explore \
              --history history.json --energy site/energy.json \
              --corpus site/corpus --corpus-out site/corpus \
              --exec --exec-rate "$EXEC_RATE" --exec-budget "$EXEC_BUDGET"

      - name: Build site (explore)
        if: env.EXPLORE == 'true' && steps.explore.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        run: python3 fuzz_site.py --reduce --label explore --results out-explore --site site

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Results for llvm-project $(git -C .. rev-parse --short=12 HEAD:llvm-project)"
          # One commit only: history lives in data/*.json, not in git.
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
          du -sh .

      - name: Job summary
        if: always()
        run: |
          for d in out out-explore; do
            if [ -f "$d/summary.md" ]; then
              echo "## $d" >> "$GITHUB_STEP_SUMMARY"
              head -n 60 "$d/summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "Total job time: $(( ($(date +%s) - JOB_START) / 60 )) min" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isel-diff-out
          path: |
            out*/summary.md
            out*/meta.json
            out*/mutants/
          retention-days: 14
          if-no-files-found: ignore
